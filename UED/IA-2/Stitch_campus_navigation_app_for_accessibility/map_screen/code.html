<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Campus Navigator</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#11b4d4",
              "background-light": "#f6f8f8",
              "background-dark": "#101f22",
            },
            fontFamily: {
              "display": ["Public Sans", "sans-serif"]
            },
            borderRadius: {
              "DEFAULT": "0.5rem",
              "lg": "1rem",
              "xl": "1.5rem",
              "full": "9999px"
            },
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark">
<div class="relative flex h-screen w-full flex-col font-display group/design-root overflow-hidden">
<!-- Top App Bar -->
<header class="absolute top-0 left-0 right-0 z-20 bg-gradient-to-b from-background-light/80 via-background-light/60 to-transparent dark:from-background-dark/80 dark:via-background-dark/60">
<div class="flex items-center p-4 pb-2 justify-between">
<div class="flex size-12 shrink-0 items-center text-gray-800 dark:text-gray-200">
<span class="material-symbols-outlined !text-3xl">menu</span>
</div>
<h1 class="text-lg font-bold leading-tight tracking-[-0.015em] text-gray-900 dark:text-gray-50 flex-1">Campus Navigator</h1>
<div class="flex w-12 items-center justify-end">
<button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 bg-transparent text-gray-800 dark:text-gray-200 gap-2 text-base font-bold leading-normal tracking-[0.015em] min-w-0 p-0">
<span class="material-symbols-outlined !text-2xl">settings</span>
</button>
</div>
</div>
<!-- Search Bar -->
<div class="px-4 py-2">
<label class="flex flex-col min-w-40 h-14 w-full">
<div class="flex w-full flex-1 items-stretch rounded-xl h-full shadow-md bg-white/80 dark:bg-black/30 backdrop-blur-sm">
<div class="text-primary flex items-center justify-center pl-4 rounded-l-xl border-r-0">
<span class="material-symbols-outlined !text-2xl">search</span>
</div>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-r-xl text-gray-900 dark:text-gray-100 focus:outline-0 focus:ring-0 border-none bg-transparent focus:border-none h-full placeholder:text-gray-500 dark:placeholder:text-gray-400 px-4 pl-2 text-base font-normal leading-normal" placeholder="Search for a building or service..." value=""/>
</div>
</label>
</div>
<!-- Chips -->
<div class="flex gap-2 p-3 pl-4 overflow-x-auto">
<div class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-primary/20 pl-3 pr-4">
<span class="material-symbols-outlined !text-xl text-primary">accessible</span>
<p class="text-primary text-sm font-medium leading-normal">Accessible Routes</p>
</div>
<div class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-white/80 dark:bg-black/30 backdrop-blur-sm pl-3 pr-4 shadow-sm">
<span class="material-symbols-outlined !text-xl text-gray-700 dark:text-gray-300">wc</span>
<p class="text-gray-800 dark:text-gray-200 text-sm font-medium leading-normal">Restrooms</p>
</div>
<div class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-white/80 dark:bg-black/30 backdrop-blur-sm pl-3 pr-4 shadow-sm">
<span class="material-symbols-outlined !text-xl text-gray-700 dark:text-gray-300">ramp_right</span>
<p class="text-gray-800 dark:text-gray-200 text-sm font-medium leading-normal">Ramps</p>
</div>
<div class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-white/80 dark:bg-black/30 backdrop-blur-sm pl-3 pr-4 shadow-sm">
<span class="material-symbols-outlined !text-xl text-gray-700 dark:text-gray-300">elevator</span>
<p class="text-gray-800 dark:text-gray-200 text-sm font-medium leading-normal">Elevators</p>
</div>
</div>
</header>
<!-- Main Map Area -->
<main class="flex-1 flex flex-col relative">
<!-- Map Background -->
<div class="absolute inset-0 bg-cover bg-center" data-alt="Stylized map of a college campus with buildings, pathways, and green areas." style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCI1U_M8RkxxdlKC02B5GjTds7Cg-fH9t4Ky48QzsJJ0LC4uG9y-lPhDvRJD0P_jAt1YMvCXPsgYgz4pN186Ki4VvT27dIGIp5_OXztNEMfARDBkA_dE0YxJ3niW6gKb-EHAN1B6Xvfbju0EtLdzzcuxZxvCX8h6wtcpOd--_VQN0tfdzMHwhG-1t9NZj9j48lNMNfQY5scgKVHfI6WKTlol5zxxlcNZcXdUVQY2JZpwYtAXRD9Z7pB81ufBV-2mQH9fsRaQNZgvAs"); filter: grayscale(30%) brightness(1.1);'>
</div>
<!-- Map Controls -->
<div class="absolute right-4 bottom-32 mb-8 flex flex-col items-end gap-3 z-10">
<div class="flex flex-col gap-0.5">
<button class="flex size-12 items-center justify-center rounded-t-lg bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm shadow-lg text-gray-900 dark:text-gray-50">
<span class="material-symbols-outlined !text-2xl">add</span>
</button>
<button class="flex size-12 items-center justify-center rounded-b-lg bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm shadow-lg text-gray-900 dark:text-gray-50">
<span class="material-symbols-outlined !text-2xl">remove</span>
</button>
</div>
<button class="flex size-12 items-center justify-center rounded-lg bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm shadow-lg text-gray-900 dark:text-gray-50">
<span class="material-symbols-outlined !text-2xl">my_location</span>
</button>
</div>
<!-- Start Navigation Button (FAB) -->
<div class="absolute bottom-0 left-0 right-0 p-6 z-20 flex justify-center">
<button class="flex max-w-sm w-full cursor-pointer items-center justify-center overflow-hidden rounded-full h-16 px-5 bg-primary text-white text-lg font-bold leading-normal tracking-[0.015em] min-w-0 gap-3 pl-5 pr-6 shadow-2xl shadow-primary/30">
<span class="material-symbols-outlined !text-2xl">navigation</span>
<span class="truncate">Start Navigation</span>
</button>
</div>
</main>
</div>
</body></html>
