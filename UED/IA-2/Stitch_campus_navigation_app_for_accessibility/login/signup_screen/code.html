<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Campus Navigator - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#11b4d4",
              "background-light": "#f6f8f8",
              "background-dark": "#101f22",
            },
            fontFamily: {
              "display": ["Public Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex min-h-screen w-full flex-col items-center bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden" style='font-family: "Public Sans", "Noto Sans", sans-serif;'>
<div class="flex w-full max-w-md flex-col p-4">
<!-- App Logo and Header -->
<div class="flex flex-col items-center pt-10 pb-6">
<div class="flex h-16 w-16 items-center justify-center rounded-xl bg-primary/20 text-primary mb-4">
<span class="material-symbols-outlined !text-4xl">navigation</span>
</div>
<h1 class="text-[#0d191b] dark:text-white tracking-light text-[32px] font-bold leading-tight text-center">Welcome to</h1>
<h1 class="text-primary tracking-light text-[32px] font-bold leading-tight text-center">Campus Navigator</h1>
</div>
<!-- Segmented Buttons for Log In / Sign Up -->
<div class="flex px-4 py-3">
<div class="flex h-10 flex-1 items-center justify-center rounded-lg bg-primary/10 dark:bg-white/10 p-1">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 has-[:checked]:bg-background-light has-[:checked]:dark:bg-background-dark has-[:checked]:shadow-[0_1px_3px_rgba(0,0,0,0.1)] has-[:checked]:text-[#0d191b] has-[:checked]:dark:text-white text-primary/80 dark:text-primary/70 text-sm font-medium leading-normal">
<span class="truncate">Log In</span>
<input checked="" class="invisible w-0" name="auth-toggle" type="radio" value="Log In"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 has-[:checked]:bg-background-light has-[:checked]:dark:bg-background-dark has-[:checked]:shadow-[0_1px_3px_rgba(0,0,0,0.1)] has-[:checked]:text-[#0d191b] has-[:checked]:dark:text-white text-primary/80 dark:text-primary/70 text-sm font-medium leading-normal">
<span class="truncate">Sign Up</span>
<input class="invisible w-0" name="auth-toggle" type="radio" value="Sign Up"/>
</label>
</div>
</div>
<!-- Form Fields -->
<div class="flex flex-col gap-4 px-4 py-3">
<label class="flex flex-col w-full flex-1">
<p class="text-[#0d191b] dark:text-gray-300 text-base font-medium leading-normal pb-2">Email</p>
<div class="flex w-full flex-1 items-stretch rounded-xl">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl border border-[#cfe3e7] dark:border-gray-600 bg-background-light dark:bg-background-dark text-[#0d191b] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 h-14 placeholder:text-[#4c8d9a] dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="Enter your email" value=""/>
</div>
</label>
<label class="flex flex-col w-full flex-1">
<p class="text-[#0d191b] dark:text-gray-300 text-base font-medium leading-normal pb-2">Password</p>
<div class="flex w-full flex-1 items-stretch rounded-xl">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl border border-[#cfe3e7] dark:border-gray-600 bg-background-light dark:bg-background-dark text-[#0d191b] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 h-14 placeholder:text-[#4c8d9a] dark:placeholder:text-gray-500 p-[15px] rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal" placeholder="Enter your password" type="password" value=""/>
<div class="text-[#4c8d9a] dark:text-gray-400 flex border border-[#cfe3e7] dark:border-gray-600 bg-background-light dark:bg-background-dark items-center justify-center px-[15px] rounded-r-xl border-l-0">
<span class="material-symbols-outlined">visibility</span>
</div>
</div>
</label>
</div>
<!-- Action Button -->
<div class="flex px-4 py-3">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 flex-1 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] shadow-md hover:opacity-90 active:scale-[0.98] transition-transform duration-100">
<span class="truncate">Log In</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-center px-4 pt-1 pb-4">
<a class="text-primary hover:underline text-sm font-medium" href="#">Forgot Password?</a>
</div>
<!-- Separator -->
<div class="flex items-center px-4 py-3">
<div class="h-px flex-1 bg-gray-300 dark:bg-gray-600"></div>
<p class="px-3 text-sm text-gray-500 dark:text-gray-400">or</p>
<div class="h-px flex-1 bg-gray-300 dark:bg-gray-600"></div>
</div>
<!-- Social/SSO Login -->
<div class="flex flex-col gap-3 px-4 py-3">
<button class="flex h-14 w-full cursor-pointer items-center justify-center gap-3 overflow-hidden rounded-xl border border-[#cfe3e7] dark:border-gray-600 bg-background-light dark:bg-background-dark px-5 text-[#0d191b] dark:text-white text-base font-medium leading-normal tracking-[0.015em] hover:bg-gray-100 dark:hover:bg-gray-700 active:scale-[0.98] transition-all duration-100">
<img alt="Google logo" class="h-6 w-6" data-alt="Google logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAfTsOXbyTDa9HYL7zQnlYj6JAJHmYJccnRcRmtPPAG6TR4P1v5LOgvXY6fYuiv2xP1R__MrIMA2c0zRsf4SVPxSwQfie93dSB1tHU_haVFBPFNr9bFsCcilWeIy3KRaEDgr46z_hC0w_kCx3zB6ceEndI-gsyM6l_0whab_cRv4i-VkzZ4sRhrfSVSZ_TixB8_g_7mikl4ZsgTnDYs8CBO6rQyyfo0h2s4n86XKxAi-N3-_woU-WhDhWpshmIczumzMTWjTZM17k4"/>
<span class="truncate">Continue with Google</span>
</button>
<button class="flex h-14 w-full cursor-pointer items-center justify-center gap-3 overflow-hidden rounded-xl border border-[#cfe3e7] dark:border-gray-600 bg-background-light dark:bg-background-dark px-5 text-[#0d191b] dark:text-white text-base font-medium leading-normal tracking-[0.015em] hover:bg-gray-100 dark:hover:bg-gray-700 active:scale-[0.98] transition-all duration-100">
<span class="material-symbols-outlined text-primary !text-2xl">school</span>
<span class="truncate">Sign in with University ID</span>
</button>
</div>
<!-- Accessibility Shortcut -->
<div class="flex justify-center px-4 pt-6 pb-8">
<a class="flex items-center gap-2 text-gray-600 dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">accessibility_new</span>
<span class="text-sm font-medium">Accessibility Settings</span>
</a>
</div>
</div>
</div>
</body></html>
